<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="sphere" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="#bfe3f7"/><stop offset=".5" stop-color="#4a94c4"/><stop offset="1" stop-color="#1d4460"/></radialGradient>
    <radialGradient id="sat" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#3d86b8"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fd0ee"/><stop offset="1" stop-color="#3d86b8"/></linearGradient>
    <clipPath id="globe"><circle cx="64" cy="64" r="40"/></clipPath>
    <clipPath id="front"><rect x="-10" y="64" width="148" height="80"/></clipPath>
  
    
    
    
    
    
  
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe8f7"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="cb0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f6b55"/><stop offset="1" stop-color="#24382f"/></linearGradient>
    <linearGradient id="am" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d99a5b"/><stop offset="1" stop-color="#b4612f"/></linearGradient>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#24506b" stroke-opacity="0.07" stroke-width="1"/></pattern>
    <radialGradient id="fade" cx="0.82" cy="0.2" r="0.7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="m"><rect width="1200" height="630" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#m)"/>

