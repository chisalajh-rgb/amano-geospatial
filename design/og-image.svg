    <text x="80" y="318" fill="#24506b">Georeference and digitize</text>
    <text x="80" y="406"><tspan fill="#4a94c4">any map</tspan><tspan fill="#24506b">, automatically.</tspan></text>
  </g>
  <text x="80" y="476" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="400" fill="#3d5361">Scanned geological and legacy maps → GIS-ready data.</text>

