<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="0.8" cy="-0.1" r="1.1"><stop offset="0" stop-color="#1d4e8f"/><stop offset="0.55" stop-color="#0d2a54"/><stop offset="1" stop-color="#091f40"/></radialGradient>
    <linearGradient id="cb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4e8f"/><stop offset="1" stop-color="#0d2a54"/></linearGradient>
    <linearGradient id="am" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6b45a"/><stop offset="1" stop-color="#e07d2b"/></linearGradient>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/></pattern>
    <radialGradient id="fade" cx="0.82" cy="0.2" r="0.7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="m"><rect width="1200" height="630" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#m)"/>

  <!-- mark -->
  <g transform="translate(80,70) scale(0.78)">
    <circle cx="64" cy="64" r="57" fill="#ffffff"/>
    <circle cx="64" cy="64" r="57" fill="none" stroke="url(#cb)" stroke-width="6"/>
    <circle cx="103.6" cy="103.6" r="3" fill="#1d4e8f"/><circle cx="24.4" cy="103.6" r="3" fill="#1d4e8f"/>
    <circle cx="103.6" cy="24.4" r="3" fill="#1d4e8f"/><circle cx="24.4" cy="24.4" r="3" fill="#1d4e8f"/>
    <polygon points="64,22 46,64 82,64" fill="url(#am)"/>
    <polygon points="46,64 82,64 64,106" fill="url(#cb)"/>
    <circle cx="64" cy="64" r="4.5" fill="#0d2a54"/><circle cx="64" cy="64" r="1.8" fill="#f6b45a"/>
    <path d="M64 6 L66.4 16 L64 22 L61.6 16 Z" fill="url(#am)"/>
    <path d="M56 12 L64 15.5 L72 12 L64 18.5 Z" fill="url(#am)" opacity="0.9"/>
