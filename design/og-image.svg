  <g transform="translate(74,64) scale(0.875)">
  <g transform="rotate(-24 64 64)"><g transform="translate(64 64)"><ellipse rx="57" ry="20" fill="none" stroke="url(#ring)" stroke-width="3.2" opacity=".45"/><g transform="translate(44.9 12.3)"><circle r="6.5" fill="url(#sat)"/><circle r="2.4" fill="#fff" opacity=".85"/></g></g></g>
  <circle cx="64" cy="64" r="40" fill="url(#sphere)"/>
  <g clip-path="url(#globe)" fill="none" stroke="#ffffff" stroke-width="1.5" vector-effect="non-scaling-stroke" opacity=".5">
    <ellipse cx="64" cy="64" rx="40" ry="9"/><ellipse cx="64" cy="44" rx="34.6" ry="7"/><ellipse cx="64" cy="84" rx="34.6" ry="7"/>
    <g vector-effect="non-scaling-stroke"><ellipse cx="64" cy="64" rx="35" ry="40"/><ellipse cx="64" cy="64" rx="21" ry="40"/><ellipse cx="64" cy="64" rx="7" ry="40"/></g>
  </g>
  <g stroke="#e3f3fc" stroke-width="1.6" fill="none" stroke-linecap="round"><path class="link" d="M47 52 L66 44 L80 62 L58 74 Z"/></g>
  <g fill="#ffffff"><circle class="node" cx="47" cy="52" r="3.2"/><circle class="node n2" cx="66" cy="44" r="3.2"/><circle class="node n3" cx="80" cy="62" r="3.2"/><circle class="node n2" cx="58" cy="74" r="3.2"/></g>
  <ellipse cx="50" cy="45" rx="17" ry="11" fill="#fff" opacity=".13" transform="rotate(-30 50 45)"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#24506b" stroke-width="1.5" opacity=".55"/>
  <g transform="rotate(-24 64 64)" clip-path="url(#front)"><g transform="translate(64 64)"><ellipse rx="57" ry="20" fill="none" stroke="url(#ring)" stroke-width="3.2" opacity="1"/><g transform="translate(44.9 12.3)"><circle r="6.5" fill="url(#sat)"/><circle r="2.4" fill="#fff" opacity=".85"/></g></g></g>
</g>
  <text x="212" y="122" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" fill="#24506b" letter-spacing="-0.8">Amano</text>
  <text x="214" y="152" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#4a94c4" letter-spacing="8">GEOSPATIAL</text>

  <!-- headline -->
