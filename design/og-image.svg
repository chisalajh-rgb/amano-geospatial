  <text x="198" y="122" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-0.8">Amano</text>
  <text x="200" y="152" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#f6b45a" letter-spacing="8">GEOSPATIAL</text>

  <!-- headline -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.2">
    <text x="80" y="318" fill="#ffffff">Georeference and digitize</text>
    <text x="80" y="406"><tspan fill="#f6b45a">any map</tspan><tspan fill="#ffffff">, automatically.</tspan></text>
  </g>
  <text x="80" y="476" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="400" fill="#c6d6ec">Scanned geological and legacy maps → GIS-ready data.</text>

  <!-- footer line -->
  <rect x="80" y="536" width="54" height="5" rx="2.5" fill="#e8933b"/>
  <text x="80" y="580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#dbe7f7">amanogeospatial.com</text>
  <text x="1120" y="580" text-anchor="end" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500" fill="#9fb6d6">AI georeferencing · Built in Zambia</text>
